mob_id = "mob.skeleton_scout"
cap = 12
respawn_seconds = 20

[[spawns.region]]
name = "Ruins East"
min = [200, -100]
max = [400, 100]
mob_id = "mob.skeleton_warrior"
cap = 6
respawn_seconds = 30
