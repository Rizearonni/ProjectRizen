# The Ossuary
#
# A zone of bone-strewn ash fields with ancient ruins.
# This is the starter/tutorial zone.

id = "zone.ossuary"
name = "The Ossuary"
seed = 1844674407370955161

[terrain]
chunk_size = 64
verts_per_side = 65
height_scale = 48.0

[terrain.noise]
base_freq = 0.002
octaves = 5
lacunarity = 2.0
