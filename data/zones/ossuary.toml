[biomes]
ash_height_max = 0.35
rock_slope_min = 0.60

[features]
bones_density = 0.08
ruins_density = 0.02
lava_crack_density = 0.01

# Spawn regions for mobs
[[spawns.region]]
name = "North Yard"
min = [-256, -256]
