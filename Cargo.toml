[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/client",
    "crates/worldgen",
    "crates/data",
    "crates/persistence",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/project-rizen"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Math
glam = { version = "0.29", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Noise generation
noise = "0.9"

# Data files
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "migrate"] }

# Web / networking
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Graphics (client)
winit = "0.30"
wgpu = "23"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
pollster = "0.4"
